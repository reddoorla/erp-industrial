  # pinned @prismicio/mocks@2.0.0) still asks for uuid ^8; dev-only slicemachine chain.
  'uuid@<11.1.1': ^11.1.1
  # GHSA-5v7r-6r5c-r473 — @slicemachine/manager pins file-type ^18; dev-only chain.
  'file-type@>=13.0.0 <21.3.1': ^21.3.1
