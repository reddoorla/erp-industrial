# pnpm 11 reads settings from here (the package.json "pnpm" field is no longer read).
allowBuilds:
  # migrate each package from the old onlyBuiltDependencies here as `name: true`
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  protobufjs: true
  sharp: true
minimumReleaseAge: 0
overrides:
  # GHSA-pxg6-pf52-xh8x — @sveltejs/kit pins cookie ^0.6.0 even at latest; capped
  # override until it moves to >=0.7.0. (The uuid and file-type overrides that sat
  # here served only the Slice Machine chain, removed with it.)
  'cookie@<0.7.0': ^0.7.2
